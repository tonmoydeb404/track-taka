<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a7fc4" />
  <title>Offline · Track Taka</title>
  <style>
    /* Self-contained on purpose: no fonts, images or scripts to fetch.
         Tokens mirror src/styles/globals.css so this page matches the app. */
    :root {
      --background: oklch(0.975 0.006 243);
      --foreground: oklch(0.2 0.025 250);
      --muted-foreground: oklch(0.5 0.03 250);
      --primary: oklch(0.5 0.134 242.749);
      --primary-foreground: oklch(0.985 0.005 243);
      --border: oklch(0.91 0.014 243);
      --card: oklch(0.995 0.002 243);
      color-scheme: light;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --background: oklch(0.18 0.02 250);
        --foreground: oklch(0.95 0.006 243);
        --muted-foreground: oklch(0.68 0.02 250);
        --primary: oklch(0.72 0.12 243);
        --primary-foreground: oklch(0.17 0.03 250);
        --border: oklch(0.31 0.027 250);
        --card: oklch(0.22 0.024 250);
        color-scheme: dark;
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      background: var(--background);
      color: var(--foreground);
      font-family:
        var(--font-manrope, "Manrope"),
        system-ui,
        -apple-system,
        "Segoe UI",
        sans-serif;
      line-height: 1.5;
    }

    .card {
      max-width: 26rem;
      width: 100%;
      text-align: center;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 1rem;
      padding: 2rem 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .mark {
      display: block;
      width: 3.5rem;
      height: 3.5rem;
      margin-bottom: 1.25rem;
    }

    h1 {
      margin: 0 0 0.5rem;
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    p {
      margin: 0 0 1.5rem;
      font-size: 0.875rem;
      color: var(--muted-foreground);
    }

    button {
      appearance: none;
      border: 0;
      border-radius: 0.625rem;
      background: var(--primary);
      color: var(--primary-foreground);
      font: inherit;
      font-size: 0.875rem;
      font-weight: 600;
      padding: 0.625rem 1.25rem;
      cursor: pointer;
    }

    button:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
    }
  </style>
</head>

<body>
  <main class="card">
    <svg class="mark" viewBox="0 0 512 512" aria-hidden="true"><title>Track Taka</title><rect width="512" height="512" rx="112" fill="#0a7fc4"/><g><circle cx="136" cy="136" r="30" fill="#ffffff" fill-opacity="0.35"/><circle cx="256" cy="136" r="30" fill="#ffffff" fill-opacity="0.35"/><circle cx="376" cy="136" r="30" fill="#ffffff" fill-opacity="0.35"/><circle cx="136" cy="256" r="30" fill="#ffffff" fill-opacity="0.35"/><circle cx="256" cy="256" r="30" fill="#ffffff" fill-opacity="0.35"/><circle cx="376" cy="256" r="30" fill="#ffffff" fill-opacity="0.35"/><circle cx="136" cy="376" r="30" fill="#ffffff" fill-opacity="0.35"/><circle cx="256" cy="376" r="30" fill="#ffffff" fill-opacity="0.35"/><circle cx="376" cy="376" r="30" fill="#ffffff" fill-opacity="0.35"/></g><path d="M136 376H256V256H376V136" fill="none" stroke="#ffffff" stroke-width="60" stroke-linecap="round" stroke-linejoin="round"/><circle cx="376" cy="136" r="30" fill="#f2a93b"/></svg>
    <h1>You&rsquo;re offline</h1>
    <p>
      This page hasn&rsquo;t been opened on this device yet, so it isn&rsquo;t
      saved for offline use. Pages you have visited — including the app
      itself — still work.
    </p>
    <button type="button" autofocus onclick="location.reload()">Try again</button>
  </main>
</body>

</html>
